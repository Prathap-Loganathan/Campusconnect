server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# Custom Application Properties (Global)
app:
  jwt:
    secret: CampusConnectSuperSecretKeyForJWTSigningMustBeLongEnough1234567890
    expiration-ms: 86400000 # 24 hours
  upload:
    dir: uploads

spring:
  application:
    name: campusconnect-backend

  # MySQL Database Setup (Primary / Default)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://b22kxmit5ycy1ilmwarx-mysql.services.clever-cloud.com:3306/b22kxmit5ycy1ilmwarx?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:uirczhyk3lroym74}
    password: ${SPRING_DATASOURCE_PASSWORD:e17BeZ81O5Ymp1eusImf}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data-mysql.sql

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# H2 In-Memory Profile Configuration (Optional: Activate with --spring.profiles.active=h2)
---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:campusconnect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
